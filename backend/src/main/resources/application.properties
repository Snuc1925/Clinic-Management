# Server Configuration
server.port=8080

# Database Configuration
# IMPORTANT: Update these values with your MySQL credentials before running
spring.datasource.url=jdbc:mysql://localhost:3306/clinic_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
# For production, use environment variables: ${MYSQL_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# IMPORTANT: For production, use environment variables: ${JWT_SECRET}
# Generate a strong secret key using: openssl rand -base64 64
jwt.secret=MySecretKeyForJWTTokenGenerationAndValidationPurposesOnly
jwt.expiration=86400000

# Logging
logging.level.com.hust.clinic=DEBUG
